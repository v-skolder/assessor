services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: decisao_testes
      POSTGRES_USER: testes
      POSTGRES_PASSWORD: testes
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testes -d decisao_testes"]
      interval: 2s
      timeout: 3s
      retries: 30
